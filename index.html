<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>造梦江湖 Debug</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body { background: #1a1a2e; width: 100%; height: 100%; overflow: hidden; }
        #game-container { width: 100vw; height: calc(100vw * 590 / 940); max-height: 100vh; max-width: calc(100vh * 940 / 590); }
        #debug { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); color: #0f0; font-family: monospace; font-size: 11px; padding: 5px; max-height: 150px; overflow-y: auto; z-index: 100; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="debug"></div>
    <script>
        var debugEl = document.getElementById('debug');
        function log(msg) {
            debugEl.innerHTML += msg + '<br>';
            console.log('[DEBUG] ' + msg);
        }
        
        // Intercept all fetches
        var origFetch = window.fetch;
        window.fetch = function() {
            var url = arguments[0];
            log('FETCH: ' + (typeof url === 'string' ? url : url.url || url));
            return origFetch.apply(this, arguments).then(function(resp) {
                log('FETCH OK: ' + resp.status + ' ' + (typeof url === 'string' ? url.substring(0,80) : ''));
                return resp;
            }).catch(function(err) {
                log('FETCH ERR: ' + err.message);
                throw err;
            });
        };
        
        // Intercept XMLHttpRequest
        var origOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url) {
            log('XHR: ' + method + ' ' + url);
            return origOpen.apply(this, arguments);
        };
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(function(r) {
                log('SW OK: ' + r.scope);
            }).catch(function(e) {
                log('SW FAIL: ' + e.message);
            });
        }
        
        var script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2026.5.14/ruffle.js';
        script.onload = function() {
            log('Ruffle loaded');
            window.RufflePlayer = window.RufflePlayer || {};
            window.RufflePlayer.config = {
                "upgradeToHttps": false,
                "maxExecutionTime": 300,
                "logLevel": "debug",
                "autoplay": "on",
                "openUrlMode": "allow"
            };
            
            var ruffle = RufflePlayer.newest().createPlayer();
            document.getElementById('game-container').appendChild(ruffle);
            log('Player created, loading SWF...');
            ruffle.load('./zmhj.swf');
            
            // Monitor
            var checkCount = 0;
            var checkInterval = setInterval(function() {
                checkCount++;
                var shadow = ruffle.shadowRoot;
                var canvas = shadow ? shadow.querySelector('canvas') : null;
                if (canvas) {
                    log('Canvas found: ' + canvas.width + 'x' + canvas.height);
                    clearInterval(checkInterval);
                } else if (checkCount % 10 === 0) {
                    log('Waiting for canvas... (' + checkCount + 's)');
                }
            }, 1000);
        };
        script.onerror = function() { log('Ruffle load FAILED'); };
        document.head.appendChild(script);
    </script>
</body>
</html>
